# Runs the test suite on every push to main and on pull requests, and before every
# release (release.yml calls it). It needs macOS: the supervisor tests use lsof and
# pgrep the way the daemon does.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -coverprofile=coverage.txt ./...
      - name: Upload coverage
        # main already reported the tagged commit's coverage
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.txt
