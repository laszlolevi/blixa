# Builds the macOS binaries for a v* tag and publishes them as a GitHub release
# (used by install.sh). Cross-compiled on Linux, which is cheaper than a macOS runner;
# the test suite needs macOS (lsof, pgrep) and runs in the test workflow (test.yml).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: GOOS=darwin go vet ./...
      - name: Build
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath -ldflags "-s -w -X github.com/laszlolevi/blixa/internal/version.tag=$GITHUB_REF_NAME" -o "build/$arch/blixa" .
            tar -czf "dist/blixa_darwin_$arch.tar.gz" -C "build/$arch" blixa
          done
          (cd dist && sha256sum blixa_darwin_*.tar.gz > checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
