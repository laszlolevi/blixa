# Builds the macOS binaries for a v* tag and publishes them as a GitHub release
# (used by install.sh). Only a tag on a commit of main is released, and the test suite
# (test.yml, on macOS: lsof, pgrep) has to pass first; the build itself is
# cross-compiled on Linux, which is cheaper than a macOS runner.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          }

  test:
    needs: on-main
    uses: ./.github/workflows/test.yml
    secrets: inherit

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: GOOS=darwin go vet ./...
      - name: Build
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath -ldflags "-s -w -X github.com/laszlolevi/blixa/internal/version.tag=$GITHUB_REF_NAME" -o "build/$arch/blixa" .
            tar -czf "dist/blixa_darwin_$arch.tar.gz" -C "build/$arch" blixa
          done
          (cd dist && sha256sum blixa_darwin_*.tar.gz > checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
